# Product manifest. Source paths are relative to the development repository;
# destinations are relative to the assembled product root.
# Exact files map to files. Source directories ending / are recursive;
# filename patterns such as folder/*.md select immediate files.
# These grouped sources require destination ending / and retain relative paths.
# Omitted files are not distributed.

[product]
name = "DLD"
version_file = "VERSION"

[[files]]
source = "product-files/README.md"
destination = "README.md"

[[files]]
source = "dld/CONTRACT.md"
destination = "dld/CONTRACT.md"

[[files]]
source = "dld/DLD.md"
destination = "dld/DLD.md"

[[files]]
source = "dld/supporting/"
destination = "dld/supporting/"

[[files]]
source = "VERSION"
destination = "dld/VERSION"

[[files]]
source = "CHANGELOG.md"
destination = "dld/CHANGELOG.md"

[[files]]
source = "LICENSE"
destination = "dld/LICENSE"

