# Product manifest. Source paths are relative to the development repository;
# destinations are relative to the assembled product root.
# A file omitted here is not distributed.

[product]
name = "DLD"
version_file = "VERSION"

[[files]]
source = "product-files/README.md"
destination = "README.md"

[[files]]
source = "product-files/CONTEXT-REGISTRY.md"
destination = "dld/CONTEXT-REGISTRY.md"

[[files]]
source = "dld/CONTRACT.md"
destination = "dld/CONTRACT.md"

[[files]]
source = "dld/DLD.md"
destination = "dld/DLD.md"

[[files]]
source = "dld/supporting/RULES.md"
destination = "dld/supporting/RULES.md"

[[files]]
source = "dld/supporting/repository-layout.md"
destination = "dld/supporting/repository-layout.md"

[[files]]
source = "VERSION"
destination = "VERSION"

[[files]]
source = "CHANGELOG.md"
destination = "CHANGELOG.md"

[[files]]
source = "LICENSE"
destination = "LICENSE"

[[files]]
source = "LICENSE-CC0"
destination = "LICENSE-CC0"
