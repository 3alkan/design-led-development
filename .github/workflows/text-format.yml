name: Repository validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate UTF-8 and LF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test text validator
        run: python3 scripts/test-text-format.py -v
      - name: Check maintained text files
        run: python3 scripts/check-text-format.py
      - name: Test package builder
        run: python3 scripts/test-package.py -v
      - name: Assemble and validate product
        run: python3 scripts/package.py
